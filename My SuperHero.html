<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Super Hero</title>
    <style>

        body {
            background-color: navy;
            color: white;
            font-family:'Times New Roman', Times, serif;
        }
        .hero-name {
         font-size: 50px;
         font-weight: bold;
         color: yellow;
         text-shadow: 4px 4px 2px red;
            }

            .tagline {
                font-style:italic;
                color: rgba(0, 0, 255, 0.733);
                text-transform: capitalize;
            }

            .label {
                text-transform: uppercase;
                text-decoration: underline;
                color: rgba(255, 0, 0, 0.813);
            }

            .power {
                font-weight: bold;
                color: lightgreen;
            }

            .weakness {
                text-decoration: line-through;
                color: gray;
            }

            .badge {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }

            .made-by {
                color: coral;
                font-style: italic;
            }
        
    </style>
</head>
<body>
    <h1 class="hero-name">Spiderman</h1>
    <p class="tagline">the kindness hero in the world</p>

<h2 class="label">super powers</h2>
<p class="power">He can shoot webs and sling building from building with it.</p>
<p class="power">He has super strength.</p>
<p class="power">He can run really fast.</p>

<h2 class="label">weaknesses</h2>
<p class="weakness">The diffrent villains he had to fight in New York.</p>

<p class="badge">Saving New York everytime.</p>

<p class="made-by">Created by Anirudh</p>
    
</body>
</html>
